name: Build Mac app (versione 2)

# Si avvia da solo quando si pubblica un'etichetta v2.x (es. v2.0.1):
# costruisce "Programma SDARM.app" e la mette in una Release di GitHub.
# L'app installata sui Mac la trova da sola (Impostazioni › Versione) e si
# aggiorna con un clic. Il testo dell'etichetta diventa la nota mostrata
# nell'app:   git tag -a v2.0.1 -m "Cosa cambia"   e poi   git push origin v2.0.1

on:
  push:
    tags: ["v2*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlla che la versione coincida
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(python3 -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"',open('webapp/server.py').read()).group(1))")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "webapp/server.py dice $V ma l'etichetta è $GITHUB_REF_NAME"; exit 1; }
      - name: Costruisci l'app
        run: bash webapp/build_mac.sh
      - name: Pubblica la Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" dist/*-mac.zip --title "Programma SDARM $GITHUB_REF_NAME" --notes "${NOTES:-Aggiornamento}"
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: mac-build
          path: dist/*-mac.zip
