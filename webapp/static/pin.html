<!doctype html>
<html lang="it" data-theme="scuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Programma">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=3">
<title>Programma SDARM</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<form id="f" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px">
  <span class="logo" role="img" aria-label="Logo della chiesa" style="width:64px;height:64px"></span>
  <b style="font-size:20px">Collegati al Mac della chiesa</b>
  <span style="color:var(--sub);text-align:center;max-width:300px">Scrivi il PIN che trovi sul Mac, in Impostazioni › Telefono.</span>
  <input class="field" id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" aria-label="PIN" style="width:200px;height:56px;text-align:center;font-size:28px;letter-spacing:.3em">
  <button class="btn pri" style="width:200px;height:48px;border-radius:24px">Entra</button>
  <span id="err" role="alert" style="color:var(--danger);min-height:20px"></span>
</form>
<script>
document.getElementById('pin').focus();
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await fetch('/api/phone/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: document.getElementById('pin').value }) });
  const j = await r.json();
  if (j.ok) location.reload(); else document.getElementById('err').textContent = j.error || 'PIN sbagliato';
});
</script>
</body>
</html>
