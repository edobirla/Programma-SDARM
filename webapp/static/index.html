<!doctype html>
<html lang="it" data-theme="scuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Programma">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#0f1b33">
<title>Gestione programma SDARM</title>
<link rel="icon" href="/assets/app_icon.png">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/fonts.css">
</head>
<body>
<div id="app">
  <div id="dragStrip" class="pywebview-drag-region"></div>
  <header class="bar glass pywebview-drag-region">
    <div class="bar-l pywebview-drag-region"><button class="logo" data-a="toTop" aria-label="Torna in cima" title="Torna in cima"></button>
    <div data-pop style="position: relative; flex-shrink: 0">
      <button class="capsule" data-a="toggleSun" aria-label="Ora, data e tramonto">
        <span class="clock" id="clock">--:--</span><span class="sep"></span>
        <span class="date" id="date"></span>
        <span class="sun" id="sun"></span>
      </button>
      <div id="sunPop" class="popover solid pop hidden" style="left: 0; width: 330px; padding: 16px"></div>
    </div></div>
    <nav class="tabs" id="tabs" aria-label="Sezioni"><span class="pill" id="tabPill"></span></nav>
    <div class="bar-r pywebview-drag-region"><div data-pop style="position: relative">
      <label class="search" id="searchBox">
        <button data-a="openSearch" aria-label="Cerca" style="display: flex"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></svg></button>
        <input id="searchInput" placeholder="Cerca titoli, testi, versetti" aria-label="Cerca ovunque" autocomplete="off">
      </label>
      <div id="searchPop" class="popover solid pop hidden scr" style="right: 0; width: 600px; max-height: 70vh; overflow-y: auto" ></div>
    </div>
    <button class="bell" id="bell" title="Tieni premuto per suonare">
      <span class="fill"></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span id="bellLabel">Campanello</span>
    </button>
    <div data-pop style="position: relative; flex-shrink: 0">
      <button class="ibtn" id="moreBtn" data-a="toggleMore" aria-label="Altro">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>
      </button>
      <div id="morePop" class="popover solid pop hidden" style="right: 0; width: 270px"></div>
    </div></div>
  </header>
  <div class="body">
    <main id="main"></main>
    <aside class="dock" id="dock" aria-label="In onda">
      <div class="glass scr">
        <div style="display: flex; align-items: center; gap: 8px">
          <span class="livedot"></span>
          <button class="label" data-a="dockBig" style="flex: 1; text-align: left; color: var(--sub)">In onda<span class="phone-close"> · chiudi</span></button>
        </div>
        <div class="preview pvtools" id="preview"><iframe src="/output?preview=1" title="Anteprima dell'uscita" tabindex="-1"></iframe></div>
        <div id="roomWrap" style="display: none; flex-direction: column; gap: 6px"><span class="label" style="color: #64b4ff">In sala adesso</span>
          <div class="preview" id="roomPrev" style="width: 62%"><iframe src="/output?preview=room" title="Quello che vede la sala" tabindex="-1"></iframe></div></div>
        <div id="dockBody" style="display: flex; flex-direction: column; gap: 12px"></div>
      </div>
    </aside>
  </div>
</div>
<div id="modal"></div>
<div id="toast"></div>
<audio id="baseAudio" preload="auto"></audio>
<audio id="pmAudio" preload="auto"></audio>
<audio id="fxAudio" preload="auto"></audio>
<script src="/static/cloud.js"></script>
<script src="/static/shared.js"></script>
<script src="/static/sun.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
